/* ══════════════════════════════════════════
   LISTS PAGE
══════════════════════════════════════════ */
function ListsPage({ lists, setLists, activeListId, setActiveListId }) {
  const [selId,      setSelId]      = useState(lists[0]?.id||null);
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal,  setRenameVal]  = useState('');
  const [newItem,    setNewItem]    = useState('');

  const sel   = lists.find(l=>l.id===selId);
  const probs = sel ? listProbs(sel.items.length) : [];
  const maxP  = probs.length ? Math.max(...probs) : 1;

  function addList() {
    const nl={id:genId(),name:`Nuova Lista ${lists.length+1}`,items:[]};
    setLists([...lists,nl]); setSelId(nl.id); setRenamingId(nl.id); setRenameVal(nl.name);
  }
  function deleteList(id) {
    if(lists.length<=1)return;
    const next=lists.filter(l=>l.id!==id); setLists(next);
    if(selId===id)setSelId(next[0].id);
    if(activeListId===id)setActiveListId(next[0].id);
  }
  function renameList(id){const n=renameVal.trim();if(!n)return;setLists(lists.map(l=>l.id===id?{...l,name:n}:l));setRenamingId(null);}
  function updateItem(idx,val){setLists(lists.map(l=>l.id===selId?{...l,items:l.items.map((it,i)=>i===idx?val:it)}:l));}
  function removeItem(idx){setLists(lists.map(l=>l.id===selId?{...l,items:l.items.filter((_,i)=>i!==idx)}:l));}
  function moveItem(idx,dir){
    const items=[...(sel?.items||[])];const ni=idx+dir;
    if(ni<0||ni>=items.length)return;
    [items[idx],items[ni]]=[items[ni],items[idx]];
    setLists(lists.map(l=>l.id===selId?{...l,items}:l));
  }
  function addItem(){const t=newItem.trim();if(!t||!sel)return;setLists(lists.map(l=>l.id===selId?{...l,items:[...l.items,t]}:l));setNewItem('');}

  return (
    <div>
      <div className="page-header">
        <h2>📋 Gestione Liste</h2>
        <p>Crea e modifica le tue tabelle. Usa nomi in inglese per il match automatico con Open5e.</p>
      </div>
      <div className="lists-grid">
        <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
          <div className="card">
            <div className="card-title">Le tue liste</div>
            <div style={{display:'flex',flexDirection:'column',gap:'.25rem',marginBottom:'.85rem'}}>
              {lists.map(l=>(
                <button key={l.id} className={`list-btn ${selId===l.id?'sel':''}`}
                  onClick={()=>{setSelId(l.id);setRenamingId(null);}}>
                  <span className="list-btn-name">{l.name}</span>
                  <span className="list-cnt">{l.items.length}</span>
                </button>
              ))}
            </div>
            <button className="btn btn-primary" style={{width:'100%'}} onClick={addList}>+ Nuova Lista</button>
          </div>
          {sel && (
            <div className="card" style={{display:'flex',flexDirection:'column',gap:'.45rem'}}>
              <div className="card-title">Azioni</div>
              <button className="btn btn-secondary"
                style={activeListId===sel.id?{borderColor:'var(--gold)',color:'var(--gold)'}:{}}
                onClick={()=>setActiveListId(sel.id)}>
                {activeListId===sel.id?'✅ Lista attiva':'🎲 Imposta come attiva'}
              </button>
              {lists.length>1&&<button className="btn btn-danger" onClick={()=>deleteList(sel.id)}>🗑️ Elimina lista</button>}
            </div>
          )}
        </div>

        {sel ? (
          <div className="card">
            <div style={{display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'1.25rem'}}>
              {renamingId===sel.id ? (
                <>
                  <input className="input-field" value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                    onKeyDown={e=>e.key==='Enter'&&renameList(sel.id)} autoFocus />
                  <button className="btn btn-primary" onClick={()=>renameList(sel.id)}>OK</button>
                  <button className="btn btn-secondary" onClick={()=>setRenamingId(null)}>✕</button>
                </>
              ):(
                <>
                  <span style={{flex:1,fontSize:'1.05rem',fontWeight:'bold',color:'var(--gold)'}}>{sel.name}</span>
                  <button className="btn btn-secondary" onClick={()=>{setRenamingId(sel.id);setRenameVal(sel.name);}}>✏️ Rinomina</button>
                </>
              )}
            </div>
            {sel.items.length===0?(
              <div className="empty"><div className="ei">📭</div><p>Lista vuota.<br/>Aggiungi il primo incontro!</p></div>
            ):(
              sel.items.map((item,idx)=>(
                <div key={idx} className="enc-row">
                  <div className="enc-num">{idx+1}</div>
                  <div className="enc-field-wrap">
                    <input className="input-field" value={item} onChange={e=>updateItem(idx,e.target.value)} />
                    {probs[idx]!==undefined&&(
                      <div className="prob-row">
                        <div className="prob-bar"><div className="prob-fill" style={{width:`${(probs[idx]/maxP)*100}%`}}/></div>
                        <span className="prob-pct">{(probs[idx]*100).toFixed(1)}%</span>
                      </div>
                    )}
                  </div>
                  <div className="enc-actions">
                    <button className="btn btn-secondary" style={{padding:'.18rem .45rem',fontSize:'.72rem'}}
                      onClick={()=>moveItem(idx,-1)} disabled={idx===0}>▲</button>
                    <button className="btn btn-secondary" style={{padding:'.18rem .45rem',fontSize:'.72rem'}}
                      onClick={()=>moveItem(idx,1)} disabled={idx===sel.items.length-1}>▼</button>
                  </div>
                  <button className="btn btn-danger" style={{padding:'.3rem .45rem',alignSelf:'flex-start',marginTop:'5px'}}
                    onClick={()=>removeItem(idx)}>✕</button>
                </div>
              ))
            )}
            <div style={{display:'flex',gap:'.5rem',marginTop:'.85rem'}}>
              <input className="input-field" placeholder="Nuovo incontro… (Invio per aggiungere)"
                value={newItem} onChange={e=>setNewItem(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&addItem()} />
              <button className="btn btn-primary" onClick={addItem} style={{whiteSpace:'nowrap'}}>+ Aggiungi</button>
            </div>
            {sel.items.length>0&&(
              <div className="info-box" style={{marginTop:'1rem'}}>
                📊 <strong>{sel.items.length}</strong> incontri · Prob. max: <strong>{(maxP*100).toFixed(1)}%</strong>
                {sel.items.length<14&&' · Ideale: 14 elementi per 2d8'}
                {sel.items.length===14&&' · Perfetto per 2d8 ✨'}
                {sel.items.length>14&&' · >14: gli ultimi condividono uno slot'}
                <br/><span style={{fontSize:'.75rem',marginTop:'.35rem',display:'block'}}>
                  💡 Usa nomi in inglese (es: "Goblin", "Bandit") per il match automatico con Open5e.
                </span>
              </div>
            )}
          </div>
        ):(
          <div className="card"><div className="empty"><div className="ei">📋</div><p>Seleziona una lista</p></div></div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   SETTINGS PAGE
══════════════════════════════════════════ */
function SettingsPage({ settings, setSettings, lists, setLists, party, setParty, activeListId, setActiveListId }) {
  const sides=[4,6,8,10,12,20];
  function toggleVal(v){
    const ev=settings.encounterValues;
    if(ev.includes(v)){if(ev.length===1)return;setSettings({...settings,encounterValues:ev.filter(x=>x!==v)});}
    else setSettings({...settings,encounterValues:[...ev,v].sort((a,b)=>a-b)});
  }
  function changeDie(s){setSettings({...settings,checkDieSides:s,encounterValues:[s-1,s]});}
  const pct=encProb(settings.checkDieSides,settings.encounterValues);
  const ev=[...settings.encounterValues].sort((a,b)=>a-b);
  return (
    <div>
      <div className="page-header">
        <h2>⚙️ Impostazioni</h2>
        <p>Configura le probabilità di incontro casuale</p>
      </div>
      <div style={{maxWidth:480,display:'flex',flexDirection:'column',gap:'1rem'}}>
        <div className="card">
          <div className="card-title">Dado per il controllo incontro</div>
          <div className="die-opts">
            {sides.map(s=><button key={s} className={`die-opt ${settings.checkDieSides===s?'sel':''}`} onClick={()=>changeDie(s)}>d{s}</button>)}
          </div>
        </div>
        <div className="card">
          <div className="card-title">Valori che causano un incontro</div>
          <p style={{fontSize:'.82rem',color:'var(--muted)',marginBottom:'.5rem'}}>Risultati del d{settings.checkDieSides} che scatenano un incontro.</p>
          <div className="thresh-grid">
            {Array.from({length:settings.checkDieSides},(_,i)=>i+1).map(v=>(
              <button key={v} className={`thresh-btn ${settings.encounterValues.includes(v)?'sel':''}`} onClick={()=>toggleVal(v)}>{v}</button>
            ))}
          </div>
          <div className="info-box">
            Probabilità incontro: <strong>{pct}%</strong> ({settings.encounterValues.length}/{settings.checkDieSides}) · Su: <strong>{ev.join(', ')}</strong>
          </div>
        </div>
        <div className="card">
          <div className="card-title">Come funziona</div>
          <div style={{fontSize:'.83rem',color:'var(--muted)',lineHeight:'1.65',display:'flex',flexDirection:'column',gap:'.6rem'}}>
            <p><strong style={{color:'var(--text)'}}>1. Tiro di verifica</strong><br/>Si tira un d{settings.checkDieSides}. Se esce {ev.join(' o ')}, scatta un incontro ({pct}%).</p>
            <p><strong style={{color:'var(--text)'}}>2. Tipo di incontro</strong><br/>Si tirano 2d8 (risultati 2–16). Curva a campana: gli incontri centrali appaiono più spesso.</p>
            <p><strong style={{color:'var(--text)'}}>3. Stat Block automatico</strong><br/>Quando scatta un incontro, l'app cerca lo stat block su Open5e. Usa nomi in inglese nelle liste.</p>
            <p><strong style={{color:'var(--text)'}}>Consiglio</strong><br/>14 elementi sfruttano al meglio la distribuzione 2d8.</p>
          </div>
        </div>
        {/* ── Export / Import ── */}
        <div className="card">
          <div className="card-title">💾 Backup & Ripristino</div>
          <p style={{fontSize:'.82rem',color:'var(--muted)',marginBottom:'1rem'}}>
            Esporta tutti i tuoi dati (liste, party, impostazioni) in un file <code>.json</code> e reimportali su qualsiasi browser o dispositivo.
          </p>
          <div style={{display:'flex',gap:'.75rem',flexWrap:'wrap'}}>
            <button className="btn btn-primary" onClick={()=>{
              const data = {
                version: 1,
                exported: new Date().toISOString(),
                lists,
                settings,
                party,
                activeListId,
              };
              const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
              const url  = URL.createObjectURL(blob);
              const a    = document.createElement('a');
              a.href = url;
              a.download = `dnd_backup_${new Date().toISOString().slice(0,10)}.json`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
            }}>⬇️ Esporta dati</button>

            <button className="btn btn-secondary" onClick={()=>{
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = '.json,application/json';
              input.onchange = ev => {
                const file = ev.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = re => {
                  try {
                    const data = JSON.parse(re.target.result);
                    let imported = [];
                    if (data.lists    && Array.isArray(data.lists))    { setLists(data.lists);           imported.push('liste'); }
                    if (data.settings && typeof data.settings==='object'){ setSettings(data.settings);   imported.push('impostazioni'); }
                    if (data.party    && Array.isArray(data.party))    { setParty(data.party);           imported.push('party'); }
                    if (data.activeListId)                             { setActiveListId(data.activeListId); }
                    alert('✅ Importazione completata! Dati caricati: ' + (imported.join(', ') || 'nessuno'));
                  } catch(err) {
                    alert('❌ Errore: file JSON non valido o corrotto. ' + err.message);
                  }
                };
                reader.readAsText(file);
              };
              document.body.appendChild(input);
              input.click();
              document.body.removeChild(input);
            }}>⬆️ Importa dati</button>
          </div>
          <p style={{fontSize:'.75rem',color:'var(--muted)',marginTop:'.75rem',lineHeight:1.5}}>
            💡 Dopo l'importazione i dati sono subito attivi — non serve ricaricare la pagina.
          </p>
        </div>

        <button className="btn btn-secondary" style={{alignSelf:'flex-start'}} onClick={()=>setSettings(DEF_SETTINGS)}>↩️ Ripristina default</button>
      </div>
    </div>
  );
}


/* ══════════════════════════════════════════
   INITIATIVE TRACKER
══════════════════════════════════════════ */
function InitiativeTracker({ encounterName, monster, encTrigger, party }) {
  const [count,     setCount]     = useState(1);
  const [rows,      setRows]      = useState([]);
  const [launched,  setLaunched]  = useState(false);

  // Reset when new encounter rolls
  useEffect(()=>{
    if (!encTrigger) return;
    setLaunched(false);
    setRows([]);
    setCount(1);
  }, [encTrigger]);

  function launch() {
    const dexMod = monster ? abilityMod(monster.dexterity) : 0;
    const baseHP  = monster ? monster.hit_points : 10;
    const ac      = monster ? monster.armor_class : '?';

    const monsterRows = Array.from({length:count},(_,i)=>({
      id:genId(),
      name:`${encounterName} ${i+1}`,
      initiative:rollDie(20)+dexMod,
      hp:baseHP, currentHp:baseHP, ac,
      type:'monster',
    }));

    const partyRows = (party||[]).map(pc=>({
      id:genId(),
      name:pc.name,
      initiative:parseInt(pc.initiative)||0,
      hp:null, currentHp:null, ac:null,
      type:'player',
    }));

    const all = [...monsterRows,...partyRows]
      .sort((a,b)=>b.initiative!==a.initiative ? b.initiative-a.initiative : a.name.localeCompare(b.name));

    setRows(all);
    setLaunched(true);
  }

  function changeHp(id, delta) {
    setRows(rows.map(r=>r.id===id?{...r,currentHp:Math.max(0,(r.currentHp||0)+delta)}:r));
  }
  function setHpDirect(id, val) {
    const n=parseInt(val);
    if(!isNaN(n)) setRows(rows.map(r=>r.id===id?{...r,currentHp:Math.max(0,n)}:r));
  }
  function removeRow(id) { setRows(rows.filter(r=>r.id!==id)); }
  function moveRow(id,dir) {
    const idx=rows.findIndex(r=>r.id===id); if(idx<0)return;
    const ni=idx+dir; if(ni<0||ni>=rows.length)return;
    const nr=[...rows]; [nr[idx],nr[ni]]=[nr[ni],nr[idx]]; setRows(nr);
  }

  if (!encounterName) {
    return (
      <div className="sb-panel">
        <div className="sb-panel-header"><h3>⚔️ Tracker Iniziativa</h3></div>
        <div className="sb-placeholder">
          <div className="pi">🎯</div>
          <p>Lancia i dadi per avviare<br/>il tracker iniziativa.</p>
        </div>
      </div>
    );
  }

  const alive = rows.filter(r=>r.type==='monster'&&r.currentHp>0).length;
  const pcs   = rows.filter(r=>r.type==='player').length;

  return (
    <div className="sb-panel tracker-wrap">
      <div className="sb-panel-header">
        <h3>⚔️ Tracker Iniziativa</h3>
        {launched && (
          <button className="btn btn-secondary" style={{fontSize:'.7rem',padding:'.2rem .5rem'}}
            onClick={()=>{setLaunched(false);setRows([]);}}>↩ Reset</button>
        )}
      </div>

      {!launched && (
        <div className="tracker-setup">
          <div style={{fontSize:'.84rem',color:'var(--muted)',marginBottom:'.75rem'}}>
            <strong style={{color:'var(--text)'}}>{encounterName}</strong>
            {monster && (
              <span> · DEX <strong style={{color:'var(--gold)'}}>{modStr(monster.dexterity)}</strong>
              {' · '}AC <strong style={{color:'var(--gold)'}}>{monster.armor_class}</strong>
              {' · '}HP <strong style={{color:'var(--gold)'}}>{monster.hit_points}</strong></span>
            )}
            {!monster && <span style={{color:'var(--red)'}}> · Stat block non caricato — init senza bonus DEX</span>}
          </div>

          <label style={{fontSize:'.75rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:'.45rem'}}>
            Numero istanze
          </label>
          <div className="tracker-count" style={{marginBottom:'1rem'}}>
            <button className="btn btn-secondary" style={{padding:'.3rem .6rem',fontSize:'1rem'}}
              onClick={()=>setCount(c=>Math.max(1,c-1))}>−</button>
            <span className="tracker-count-val">{count}</span>
            <button className="btn btn-secondary" style={{padding:'.3rem .6rem',fontSize:'1rem'}}
              onClick={()=>setCount(c=>Math.min(20,c+1))}>+</button>
            <span style={{fontSize:'.8rem',color:'var(--muted)',marginLeft:'.25rem'}}>
              {encounterName}{count>1?` ×${count}`:''}
            </span>
          </div>

          {(party||[]).length>0 && (
            <div className="info-box" style={{marginBottom:'.85rem'}}>
              🧙 {party.length} PG nel party verranno inseriti in ordine di iniziativa.
            </div>
          )}

          <button className="btn btn-primary" style={{width:'100%'}} onClick={launch}>
            🎲 Lancia Iniziativa
          </button>
        </div>
      )}

      {launched && rows.length>0 && (
        <>
          <table className="tracker-table">
            <thead>
              <tr>
                <th style={{width:28}}></th>
                <th style={{textAlign:'left'}}>Nome</th>
                <th style={{textAlign:'center',width:96}}>HP</th>
                <th style={{textAlign:'center',width:38}}>CA</th>
                <th style={{width:28}}></th>
              </tr>
            </thead>
            <tbody>
              {rows.map((row,idx)=>{
                const isDead = row.type==='monster' && row.currentHp===0;
                return (
                  <tr key={row.id}
                    className={`${row.type==='player'?'tracker-row-pc':''} ${isDead?'tracker-row-dead':''}`}>
                    <td style={{textAlign:'center'}}>
                      <div style={{display:'flex',flexDirection:'column',gap:1}}>
                        <button className="btn btn-secondary" style={{padding:'1px 4px',fontSize:'.6rem',lineHeight:1.1}}
                          onClick={()=>moveRow(row.id,-1)} disabled={idx===0}>▲</button>
                        <button className="btn btn-secondary" style={{padding:'1px 4px',fontSize:'.6rem',lineHeight:1.1}}
                          onClick={()=>moveRow(row.id,1)} disabled={idx===rows.length-1}>▼</button>
                      </div>
                    </td>
                    <td style={{
                      fontWeight:row.type==='player'?'bold':'normal',
                      color:row.type==='player'?'var(--gold)':isDead?'var(--muted)':'var(--text)',
                      fontSize:'.82rem',
                    }}>

                      {isDead&&<span style={{marginRight:'.25rem',color:'var(--red)'}}>💀</span>}
                      {row.name}
                    </td>
                    <td>
                      {row.type==='monster' ? (
                        <div className="hp-ctrl">
                          <button className="btn btn-secondary" style={{padding:'1px 5px',fontSize:'.7rem'}}
                            onClick={()=>changeHp(row.id,-1)}>−</button>
                          <input
                            className="hp-val"
                            style={{background:'transparent',border:'none',color:row.currentHp===0?'var(--red)':'var(--text)',outline:'none',cursor:'text'}}
                            value={`${row.currentHp}/${row.hp}`}
                            onChange={e=>{
                              const v=e.target.value.split('/')[0];
                              setHpDirect(row.id, v);
                            }}
                          />
                          <button className="btn btn-secondary" style={{padding:'1px 5px',fontSize:'.7rem'}}
                            onClick={()=>changeHp(row.id,1)}>+</button>
                        </div>
                      ) : (
                        <span style={{display:'block',textAlign:'center',color:'var(--muted)'}}>—</span>
                      )}
                    </td>
                    <td style={{textAlign:'center',fontSize:'.82rem',
                      color: row.ac ? 'var(--text)' : 'var(--muted)',
                      fontWeight: row.type==='monster' ? '600' : 'normal'}}>
                      {row.ac??'—'}
                    </td>
                    <td style={{textAlign:'center'}}>
                      <button className="btn btn-danger" style={{padding:'2px 5px',fontSize:'.68rem'}}
                        onClick={()=>removeRow(row.id)}>✕</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="tracker-foot">
            {alive} mostri in piedi · {pcs} PG · {rows.filter(r=>r.type==='monster'&&r.currentHp===0).length} sconfitti
          </div>
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   PARTY PAGE
══════════════════════════════════════════ */
function PartyPage({ party, setParty }) {
  const [newName, setNewName] = useState('');
  const [newInit, setNewInit] = useState('');

  function addPC() {
    const name=newName.trim();
    const init=parseInt(newInit);
    if(!name||isNaN(init))return;
    setParty([...party,{id:genId(),name,initiative:init}]);
    setNewName(''); setNewInit('');
  }
  function removePC(id) { setParty(party.filter(p=>p.id!==id)); }
  function updatePC(id,field,val) {
    setParty(party.map(p=>p.id===id?{...p,[field]:field==='initiative'?(parseInt(val)||0):val}:p));
  }
  function movePC(id,dir) {
    const idx=party.findIndex(p=>p.id===id); if(idx<0)return;
    const ni=idx+dir; if(ni<0||ni>=party.length)return;
    const np=[...party]; [np[idx],np[ni]]=[np[ni],np[idx]]; setParty(np);
  }

  return (
    <div>
      <div className="page-header">
        <h2>🧙 Party</h2>
        <p>Inserisci i personaggi e la loro iniziativa di sessione. Verranno piazzati automaticamente nel tracker.</p>
      </div>
      <div style={{maxWidth:520}}>
        <div className="card">
          <div className="card-title">Personaggi</div>

          {party.length===0 ? (
            <div className="empty"><div className="ei">🧙</div><p>Nessun personaggio.<br/>Aggiungine uno qui sotto!</p></div>
          ) : (
            <div style={{marginBottom:'1rem'}}>
              <div style={{display:'grid',gridTemplateColumns:'28px 1fr 90px 28px 28px',gap:'.4rem',
                alignItems:'center',marginBottom:'.35rem',
                padding:'0 .2rem',fontSize:'.68rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em'}}>
                <span></span><span>Nome PG</span><span style={{textAlign:'center'}}>Iniziativa</span><span></span><span></span>
              </div>
              {party.map((pc,idx)=>(
                <div key={pc.id} style={{display:'grid',gridTemplateColumns:'28px 1fr 90px 28px 28px',gap:'.4rem',alignItems:'center',marginBottom:'.4rem'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:1}}>
                    <button className="btn btn-secondary" style={{padding:'1px 4px',fontSize:'.6rem',lineHeight:1.1}}
                      onClick={()=>movePC(pc.id,-1)} disabled={idx===0}>▲</button>
                    <button className="btn btn-secondary" style={{padding:'1px 4px',fontSize:'.6rem',lineHeight:1.1}}
                      onClick={()=>movePC(pc.id,1)} disabled={idx===party.length-1}>▼</button>
                  </div>
                  <input className="input-field" value={pc.name}
                    onChange={e=>updatePC(pc.id,'name',e.target.value)}
                    placeholder="Nome PG" />
                  <input className="input-field" type="number" value={pc.initiative}
                    onChange={e=>updatePC(pc.id,'initiative',e.target.value)}
                    style={{textAlign:'center'}} placeholder="Init" />
                  <span style={{fontSize:'.9rem',textAlign:'center',color:'var(--gold)',fontWeight:'bold'}}>{pc.initiative>=0?'+':''}{pc.initiative}</span>
                  <button className="btn btn-danger" style={{padding:'.28rem .4rem',justifyContent:'center'}}
                    onClick={()=>removePC(pc.id)}>✕</button>
                </div>
              ))}
            </div>
          )}

          <div style={{display:'grid',gridTemplateColumns:'1fr 90px auto',gap:'.5rem',alignItems:'center',borderTop: party.length>0?'1px solid var(--border)':'none',paddingTop:party.length>0?'1rem':0}}>
            <input className="input-field" placeholder="Nome PG…" value={newName}
              onChange={e=>setNewName(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&document.getElementById('addPcBtn').click()} />
            <input className="input-field" type="number" placeholder="Iniziativa" value={newInit}
              onChange={e=>setNewInit(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&document.getElementById('addPcBtn').click()}
              style={{textAlign:'center'}} />
            <button id="addPcBtn" className="btn btn-primary" onClick={addPC}>+ Aggiungi</button>
          </div>
        </div>

        <div className="info-box" style={{marginTop:'1rem'}}>
          💡 L'iniziativa qui è fissa per tutta la sessione — modificala solo se cambia.
          Quando lanci i dadi sulla pagina <strong>Lancia i Dadi</strong>, i PG vengono automaticamente inseriti nel tracker nella posizione corretta.
        </div>
      </div>
    </div>
  );
}


/* ══════════════════════════════════════════
   BATTLE PAGE — search hook
══════════════════════════════════════════ */
function useBattleSearch() {
  const [query,   setQuery]   = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState(null);
  const abortRef = useRef(null);

  const search = useCallback(async (q) => {
    q = q.trim(); if (!q) return;
    if (abortRef.current) abortRef.current.abort();
    abortRef.current = new AbortController();
    const sig = abortRef.current.signal;
    setLoading(true); setError(null); setResults([]);
    try {
      try {
        const r2 = await fetch(
          `https://api.open5e.com/v2/creatures/?document__key__in=srd-2024&name__icontains=${encodeURIComponent(q)}&limit=12`,
          {signal: sig}
        );
        if (r2.ok) {
          const d2 = await r2.json();
          if (d2.results?.length) {
            setResults(d2.results.map(r => normalizeCreature(r, 'v2'))); return;
          }
        }
      } catch(e2) {
        if (e2.name === 'AbortError') throw e2;
        console.warn('[Battle v2]', e2.message);
      }
      const r1 = await fetch(
        `https://api.open5e.com/v1/monsters/?search=${encodeURIComponent(q)}&limit=12`,
        {signal: sig}
      );
      if (!r1.ok) throw new Error(`HTTP ${r1.status}`);
      const d1 = await r1.json();
      if (d1.results?.length) {
        setResults(d1.results.map(r => normalizeCreature(r, 'v1'))); return;
      }
      setError(`Nessun risultato per "${q}".`);
    } catch(e) {
      if (e.name !== 'AbortError') setError(`Errore: ${e.message}`);
    } finally { setLoading(false); }
  }, []);

  return { query, setQuery, results, setResults, loading, error, search };
}

/* ══════════════════════════════════════════
   BATTLE PAGE
══════════════════════════════════════════ */
function BattlePage({ party }) {
  const { query, setQuery, results, setResults, loading, error, search } = useBattleSearch();
  const [entries,  setEntries]  = useState([]); // [{id, monster, count}]
  const [rows,     setRows]     = useState([]);
  const [launched, setLaunched] = useState(false);

  function addMonster(m) {
    const existing = entries.find(e => e.monster.slug === m.slug || e.monster.name === m.name);
    if (existing) {
      setEntries(entries.map(e => e.id === existing.id ? {...e, count: e.count+1} : e));
    } else {
      setEntries([...entries, {id: genId(), monster: m, count: 1}]);
    }
    setResults([]); setQuery('');
  }

  function removeEntry(id) { setEntries(entries.filter(e => e.id !== id)); }

  function updateCount(id, val) {
    const n = Math.max(1, parseInt(val) || 1);
    setEntries(entries.map(e => e.id === id ? {...e, count: n} : e));
  }

  function launch() {
    const monsterRows = entries.flatMap(({monster, count}) =>
      Array.from({length: count}, (_, i) => ({
        id: genId(),
        name: count > 1 ? `${monster.name} ${i+1}` : monster.name,
        initiative: rollDie(20) + abilityMod(monster.dexterity ?? 10),
        hp: monster.hit_points ?? 0,
        currentHp: monster.hit_points ?? 0,
        ac: monster.armor_class,
        type: 'monster',
      }))
    );
    const partyRows = (party || []).map(pc => ({
      id: genId(), name: pc.name,
      initiative: parseInt(pc.initiative) || 0,
      hp: null, currentHp: null, ac: null, type: 'player',
    }));
    const all = [...monsterRows, ...partyRows]
      .sort((a,b) => b.initiative !== a.initiative ? b.initiative - a.initiative : a.name.localeCompare(b.name));
    setRows(all); setLaunched(true);
  }

  function changeHp(id, delta) {
    setRows(rows.map(r => r.id===id ? {...r, currentHp: Math.max(0,(r.currentHp||0)+delta)} : r));
  }
  function setHpDirect(id, val) {
    const n = parseInt(val);
    if (!isNaN(n)) setRows(rows.map(r => r.id===id ? {...r, currentHp:Math.max(0,n)} : r));
  }
  function removeRow(id)   { setRows(rows.filter(r => r.id !== id)); }
  function moveRow(id,dir) {
    const idx = rows.findIndex(r => r.id===id); if (idx<0) return;
    const ni = idx+dir; if (ni<0 || ni>=rows.length) return;
    const nr = [...rows]; [nr[idx],nr[ni]]=[nr[ni],nr[idx]]; setRows(nr);
  }

  const anyEntry = entries.length > 0;

  return (
    <div style={{display:'flex', flexDirection:'column', gap:'1rem'}}>

      {/* ── TOP: search bar ── */}
      <div style={{background:'var(--surf)', border:'1px solid var(--border)', borderRadius:'10px', padding:'1rem'}}>
        <form onSubmit={e=>{e.preventDefault(); search(query);}}>
          <div style={{display:'flex', gap:'.5rem'}}>
            <input className="input-field" style={{flex:1}}
              placeholder="Cerca creatura (es: Goblin, Dragon, Troll…)"
              value={query} onChange={e=>setQuery(e.target.value)} />
            <button className="btn btn-primary" type="submit" disabled={loading} style={{whiteSpace:'nowrap'}}>
              {loading ? '⏳' : '🔍 Cerca'}
            </button>
          </div>
        </form>

        {error && <div className="sb-error" style={{marginTop:'.5rem'}}>{error}</div>}

        {/* Search results grid */}
        {results.length > 0 && (
          <div style={{marginTop:'.75rem', display:'grid',
            gridTemplateColumns:'repeat(auto-fill, minmax(190px,1fr))', gap:'.4rem'}}>
            {results.map(m => (
              <button key={m.slug||m.name} className="btn btn-secondary"
                style={{textAlign:'left', padding:'.45rem .65rem'}}
                onClick={()=>addMonster(m)}>
                <div style={{fontWeight:'bold', color:'var(--gold)', fontSize:'.84rem'}}>{m.name}</div>
                <div style={{fontSize:'.71rem', color:'var(--muted)', marginTop:'1px'}}>
                  {m.size} {m.type} · CR {m.challenge_rating}
                  {m._srdYear && <span style={{marginLeft:'.35rem', opacity:.6}}>SRD {m._srdYear}</span>}
                </div>
              </button>
            ))}
          </div>
        )}

        {/* Selected encounter chips + launch */}
        {anyEntry && (
          <div style={{marginTop:'.75rem', display:'flex', flexWrap:'wrap', gap:'.5rem', alignItems:'center'}}>
            {entries.map(e => (
              <div key={e.id} style={{display:'flex', alignItems:'center', gap:'.35rem',
                background:'var(--surf2)', border:'1px solid var(--border)', borderRadius:'8px',
                padding:'.3rem .6rem'}}>
                <span style={{fontWeight:'bold', color:'var(--gold)', fontSize:'.85rem'}}>{e.monster.name}</span>
                <span style={{color:'var(--muted)'}}>×</span>
                <input type="number" min="1" max="20" value={e.count}
                  onChange={ev=>updateCount(e.id, ev.target.value)}
                  style={{width:'2.4rem', background:'transparent', border:'1px solid var(--border)',
                    borderRadius:'4px', color:'var(--text)', textAlign:'center',
                    fontSize:'.85rem', padding:'1px 3px'}} />
                <button onClick={()=>removeEntry(e.id)}
                  style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'.9rem',padding:'0 1px',lineHeight:1}}>✕</button>
              </div>
            ))}
            <div style={{marginLeft:'auto', display:'flex', gap:'.5rem'}}>
              {launched && (
                <button className="btn btn-secondary" onClick={()=>{setRows([]); setLaunched(false);}}>↩ Reset</button>
              )}
              <button className="btn btn-primary" onClick={launch} disabled={!anyEntry}>
                ⚔️ {launched ? 'Rilancia' : 'Lancia iniziativa'}
              </button>
            </div>
          </div>
        )}
      </div>

      {/* ── BOTTOM: tracker + stat blocks ── */}
      {anyEntry && (
        <div style={{display:'grid', gridTemplateColumns:'300px 1fr', gap:'1rem', alignItems:'start'}}>

          {/* Left: initiative table */}
          <div className="sb-panel">
            <div className="sb-panel-header"><h3>⚔️ Iniziativa</h3></div>
            {!launched ? (
              <div className="sb-placeholder">
                <div className="pi">🎯</div>
                <p>Aggiungi creature e clicca<br/>"Lancia iniziativa".</p>
              </div>
            ) : (
              <div style={{overflowX:'auto'}}>
                <table className="tracker-table">
                  <thead>
                    <tr>
                      <th style={{width:28}}></th>
                      <th style={{textAlign:'left'}}>Nome</th>
                      <th style={{textAlign:'center', width:90}}>HP</th>
                      <th style={{textAlign:'center', width:40}}>CA</th>
                      <th style={{width:28}}></th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((row, idx) => {
                      const isDead = row.type==='monster' && row.currentHp===0;
                      return (
                        <tr key={row.id}
                          className={`${row.type==='player'?'tracker-row-pc':''} ${isDead?'tracker-row-dead':''}`}>
                          <td style={{textAlign:'center'}}>
                            <div style={{display:'flex',flexDirection:'column',gap:1}}>
                              <button className="btn btn-secondary"
                                style={{padding:'1px 4px',fontSize:'.6rem',lineHeight:1.1}}
                                onClick={()=>moveRow(row.id,-1)} disabled={idx===0}>▲</button>
                              <button className="btn btn-secondary"
                                style={{padding:'1px 4px',fontSize:'.6rem',lineHeight:1.1}}
                                onClick={()=>moveRow(row.id,1)} disabled={idx===rows.length-1}>▼</button>
                            </div>
                          </td>
                          <td style={{
                            fontWeight: row.type==='player'?'bold':'normal',
                            color: row.type==='player'?'var(--gold)':isDead?'var(--muted)':'var(--text)',
                            fontSize:'.82rem'}}>
                            {isDead && <span style={{marginRight:'.25rem',color:'var(--red)'}}>💀</span>}
                            {row.name}
                            <span style={{color:'var(--muted)',fontSize:'.7rem',marginLeft:'.3rem'}}>({row.initiative})</span>
                          </td>
                          <td>
                            {row.type==='monster' ? (
                              <div className="hp-ctrl">
                                <button className="btn btn-secondary"
                                  style={{padding:'1px 5px',fontSize:'.7rem'}}
                                  onClick={()=>changeHp(row.id,-1)}>−</button>
                                <input className="hp-val"
                                  style={{background:'transparent',border:'none',
                                    color:row.currentHp===0?'var(--red)':'var(--text)',
                                    outline:'none',cursor:'text'}}
                                  value={`${row.currentHp}/${row.hp}`}
                                  onChange={e=>{const v=e.target.value.split('/')[0]; setHpDirect(row.id,v);}} />
                                <button className="btn btn-secondary"
                                  style={{padding:'1px 5px',fontSize:'.7rem'}}
                                  onClick={()=>changeHp(row.id,1)}>+</button>
                              </div>
                            ) : (
                              <span style={{display:'block',textAlign:'center',color:'var(--muted)'}}>—</span>
                            )}
                          </td>
                          <td style={{textAlign:'center',fontSize:'.82rem',
                            color:row.ac?'var(--text)':'var(--muted)',
                            fontWeight:row.type==='monster'?'600':'normal'}}>
                            {row.ac??'—'}
                          </td>
                          <td style={{textAlign:'center'}}>
                            <button className="btn btn-danger"
                              style={{padding:'2px 5px',fontSize:'.68rem'}}
                              onClick={()=>removeRow(row.id)}>✕</button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* Right: stat blocks grid */}
          <div style={{display:'grid',
            gridTemplateColumns:'repeat(auto-fill, minmax(310px,1fr))',
            gap:'1rem'}}>
            {entries.map(e => (
              <ErrBound key={e.monster.slug||e.monster.name}>
                <StatBlock m={e.monster} />
              </ErrBound>
            ))}
          </div>
        </div>
      )}

      {!anyEntry && (
        <div style={{textAlign:'center',padding:'3rem 1rem',color:'var(--muted)'}}>
          <div style={{fontSize:'3rem',marginBottom:'1rem'}}>⚔️</div>
          <p>Cerca e aggiungi creature per costruire il tuo incontro.</p>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════ */
function App() {
  const stored=loadData();
  const [page,         setPage]        = useState('roll');
  const [lists,        setListsRaw]    = useState(stored.lists);
  const [settings,     setSettingsRaw] = useState(stored.settings);
  const [activeListId, setActiveIdRaw] = useState(stored.activeListId);
  const [party, setPartyRaw] = useState(()=>{ try{return JSON.parse(localStorage.getItem('dnd_party')||'[]');}catch{return [];} });

  function setLists(v)        {setListsRaw(v);    save('dnd_lists',v);}
  function setSettings(v)     {setSettingsRaw(v); save('dnd_settings',v);}
  function setActiveListId(v) {setActiveIdRaw(v); save('dnd_active_list',v);}
  function setParty(v)        {setPartyRaw(v);   save('dnd_party',v);}

  const nav=[
    {id:'roll',    icon:'🎲',label:'Lancia i Dadi'},
    {id:'battle',  icon:'⚔️',label:'Battaglia'},
    {id:'lists',   icon:'📋',label:'Liste Incontri'},
    {id:'party',   icon:'🧙',label:'Party'},
    {id:'settings',icon:'⚙️',label:'Impostazioni'},
  ];

  return (
    <div>
      <nav className="sidebar">
        <div className="sb-logo">
          <div className="ico">⚔️</div>
          <h1>Generatore<br/>Incontri D&D</h1>
        </div>
        <div style={{padding:'.5rem 0'}}>
          {nav.map(n=>(
            <div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
              <span>{n.icon}</span><span>{n.label}</span>
            </div>
          ))}
        </div>
        <div className="sb-footer">
          <label>Lista attiva</label>
          <select value={activeListId} onChange={e=>setActiveListId(e.target.value)}>
            {lists.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
          </select>
        </div>
      </nav>
      <main className="main">
        {page==='roll'     && <RollPage     lists={lists} settings={settings} activeListId={activeListId} setActiveListId={setActiveListId} party={party} />}
        {page==='battle'   && <BattlePage   party={party} />}
        {page==='lists'    && <ListsPage    lists={lists} setLists={setLists} activeListId={activeListId} setActiveListId={setActiveListId} />}
        {page==='party'    && <PartyPage    party={party} setParty={setParty} />}
        {page==='settings' && <SettingsPage settings={settings} setSettings={setSettings} lists={lists} setLists={setLists} party={party} setParty={setParty} activeListId={activeListId} setActiveListId={setActiveListId} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
