<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 Generatore Incontri D&D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:      #0f0e17;
      --surf:    #1a1a2e;
      --surf2:   #16213e;
      --border:  #2a2a4a;
      --gold:    #c9a227;
      --gold-l:  #e8c84a;
      --red:     #e63946;
      --green:   #2dc653;
      --text:    #fffffe;
      --muted:   #a7a9be;
      --sw:      220px;
    }
    html,body { height:100%; }
    body {
      font-family:'Georgia','Times New Roman',serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width:var(--sw); background:var(--surf);
      border-right:1px solid var(--border);
      display:flex; flex-direction:column;
      position:fixed; top:0; left:0; height:100vh; overflow-y:auto;
    }
    .sb-logo { text-align:center; padding:1.5rem 1rem 1.25rem; border-bottom:1px solid var(--border); }
    .sb-logo .ico { font-size:2.2rem; }
    .sb-logo h1  { font-size:1rem; color:var(--gold); line-height:1.4; margin-top:.4rem; }
    .nav-item {
      padding:.7rem 1.25rem; cursor:pointer; color:var(--muted);
      transition:all .18s; display:flex; align-items:center;
      gap:.65rem; font-size:.9rem; user-select:none;
    }
    .nav-item:hover  { color:var(--text); background:rgba(255,255,255,.05); }
    .nav-item.active { color:var(--gold); background:rgba(201,162,39,.1); border-left:3px solid var(--gold); }
    .sb-footer { margin-top:auto; padding:.85rem 1rem; border-top:1px solid var(--border); }
    .sb-footer label { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:.4rem; }
    .sb-footer select { width:100%; background:var(--surf2); border:1px solid var(--border); color:var(--text); padding:.45rem .6rem; border-radius:5px; font-family:inherit; font-size:.8rem; cursor:pointer; }

    /* ── MAIN ── */
    .main { margin-left:var(--sw); flex:1; padding:2rem 2.5rem; min-height:100vh; }
    .page-header { margin-bottom:1.75rem; }
    .page-header h2 { font-size:1.7rem; color:var(--gold); }
    .page-header p  { color:var(--muted); margin-top:.2rem; font-size:.9rem; }

    /* ── BUTTONS ── */
    .btn { padding:.5rem 1rem; border-radius:6px; border:none; cursor:pointer; font-family:inherit; font-size:.85rem; transition:all .15s; display:inline-flex; align-items:center; gap:.35rem; }
    .btn-primary   { background:var(--gold); color:#000; }
    .btn-primary:hover { background:var(--gold-l); }
    .btn-secondary { background:transparent; border:1px solid var(--border); color:var(--muted); }
    .btn-secondary:hover { border-color:var(--muted); color:var(--text); }
    .btn-danger    { background:transparent; border:1px solid rgba(230,57,70,.35); color:var(--red); font-size:.78rem; }
    .btn-danger:hover { background:rgba(230,57,70,.1); }
    .btn-roll {
      background:linear-gradient(135deg,#7b1111,#c0392b);
      color:#fff; border:none; padding:1.1rem 2.8rem;
      font-size:1.25rem; font-family:'Georgia',serif;
      border-radius:10px; cursor:pointer; letter-spacing:.1em;
      text-transform:uppercase;
      box-shadow:0 4px 22px rgba(200,50,50,.4);
      transition:all .2s; user-select:none;
    }
    .btn-roll:hover  { transform:translateY(-2px); box-shadow:0 6px 28px rgba(200,50,50,.6); }
    .btn-roll:active { transform:translateY(0); }
    .btn-roll:disabled { opacity:.45; cursor:not-allowed; transform:none; }

    /* ── INPUT ── */
    .input-field { width:100%; padding:.55rem .75rem; background:var(--surf2); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:inherit; font-size:.88rem; outline:none; transition:border-color .15s; }
    .input-field:focus { border-color:var(--gold); }

    /* ── CARD ── */
    .card { background:var(--surf); border:1px solid var(--border); border-radius:12px; padding:1.4rem; }
    .card-title { font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); margin-bottom:.9rem; }

    /* ── DICE ── */
    .dice-row { display:flex; gap:1.2rem; align-items:center; justify-content:center; }
    .die { width:74px; height:74px; background:var(--surf2); border:2px solid var(--border); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:1.9rem; font-weight:bold; transition:border-color .3s,box-shadow .3s,color .3s; }
    .die-lbl { font-size:.58rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
    .die-sep { font-size:1.4rem; color:var(--muted); }
    .die.rolling        { animation:shake .08s infinite; border-color:var(--gold); box-shadow:0 0 18px rgba(201,162,39,.45); }
    .die.landed-enc     { border-color:var(--red);   box-shadow:0 0 14px rgba(230,57,70,.35);  color:var(--red);   }
    .die.landed-safe    { border-color:var(--green); box-shadow:0 0 14px rgba(45,198,83,.3);   color:var(--green); }
    .die.landed-neutral { border-color:var(--gold);  box-shadow:0 0 14px rgba(201,162,39,.3);  color:var(--gold);  }
    .die.sum-die        { background:rgba(201,162,39,.1); border-color:var(--gold); color:var(--gold); }

    /* ── RESULT CARD ── */
    .result-card { width:100%; background:var(--surf); border:1px solid var(--border); border-radius:14px; padding:2rem; text-align:center; }
    .result-card.enc  { border-color:var(--red);   box-shadow:0 0 40px rgba(230,57,70,.18); }
    .result-card.safe { border-color:var(--green); box-shadow:0 0 40px rgba(45,198,83,.1);  }
    .result-label { font-size:.72rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin-bottom:.4rem; }
    .result-big   { font-size:2.2rem; font-weight:bold; margin-bottom:.75rem; }
    .result-big.enc  { color:var(--red);   text-shadow:0 0 20px rgba(230,57,70,.45); }
    .result-big.safe { color:var(--green); }
    .enc-name { font-size:1.75rem; color:var(--gold); text-shadow:0 0 10px rgba(201,162,39,.25); }
    .enc-sub  { font-size:.85rem; color:var(--muted); margin-top:.6rem; }

    /* ── HISTORY ── */
    .history-list { width:100%; }
    .history-list h3 { font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:.6rem; }
    .hist-item { display:flex; align-items:center; gap:.65rem; padding:.45rem .7rem; background:var(--surf); border:1px solid var(--border); border-radius:7px; margin-bottom:.35rem; font-size:.83rem; }
    .badge { padding:.12rem .45rem; border-radius:99px; font-size:.68rem; font-weight:bold; }
    .badge-enc  { background:rgba(230,57,70,.2);  color:var(--red);   }
    .badge-safe { background:rgba(45,198,83,.15); color:var(--green); }
    .hist-dice { font-size:.72rem; color:var(--muted); margin-left:auto; white-space:nowrap; }

    /* ── ROLL PAGE LAYOUT ── */
    .roll-layout {
      display:grid;
      grid-template-columns:minmax(240px,320px) minmax(0,360px) minmax(0,270px);
      gap:1.5rem;
      align-items:start;
    }
    .roll-col { display:flex; flex-direction:column; align-items:center; gap:1.75rem; }

    /* ── STAT BLOCK PANEL ── */
    .sb-panel {
      position:sticky; top:1.5rem;
      background:var(--surf); border:1px solid var(--border);
      border-radius:14px; overflow:hidden;
    }
    .sb-panel-header {
      padding:.75rem 1rem;
      background:var(--surf2);
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:.5rem;
    }
    .sb-panel-header h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); flex:1; }
    .sb-search { padding:.75rem 1rem; border-bottom:1px solid var(--border); display:flex; gap:.5rem; }
    .sb-body   { max-height:calc(100vh - 200px); overflow-y:auto; padding:0; }

    .sb-suggestions {
      padding:.5rem 1rem;
      border-bottom:1px solid var(--border);
      background:var(--surf2);
    }
    .sb-suggestions p { font-size:.72rem; color:var(--muted); margin-bottom:.35rem; }
    .sb-sugg-btn {
      display:inline-block; margin:.15rem .2rem;
      padding:.2rem .55rem;
      background:var(--surf);
      border:1px solid var(--border);
      border-radius:99px;
      font-size:.72rem; color:var(--muted);
      cursor:pointer; transition:all .14s;
      font-family:inherit;
    }
    .sb-sugg-btn:hover { border-color:var(--gold); color:var(--gold); }

    .sb-placeholder {
      padding:3rem 1.5rem; text-align:center; color:var(--muted);
    }
    .sb-placeholder .pi { font-size:2.5rem; margin-bottom:.75rem; }
    .sb-placeholder p   { font-size:.85rem; line-height:1.6; }

    .sb-loading { padding:2rem; text-align:center; color:var(--muted); font-size:.9rem; }
    .sb-error   { padding:1rem; margin:.5rem; background:rgba(230,57,70,.1); border:1px solid rgba(230,57,70,.3); border-radius:8px; font-size:.82rem; color:var(--red); }

    /* ── STAT BLOCK (parchment) ── */
    .statblock {
      background:#fdf1dc;
      color:#1a1a1a;
      font-family:'Georgia','Times New Roman',serif;
      font-size:.83rem;
      line-height:1.45;
    }
    .statblock-name {
      background:linear-gradient(135deg,#58180d,#7a2217);
      color:#fff;
      padding:.9rem 1.1rem .7rem;
      font-size:1.35rem;
      font-weight:bold;
      letter-spacing:.02em;
    }
    .statblock-type {
      background:linear-gradient(135deg,#58180d,#7a2217);
      color:rgba(255,255,255,.82);
      padding:0 1.1rem .8rem;
      font-size:.78rem;
      font-style:italic;
    }
    .statblock-divider {
      height:6px;
      background:linear-gradient(90deg,#9c2f2f,#d4a84b,#9c2f2f);
      margin:0;
    }
    .statblock-body { padding:.65rem 1.1rem; }
    .statblock-row {
      margin:.25rem 0;
      font-size:.83rem;
    }
    .statblock-row strong {
      color:#58180d;
      font-weight:bold;
    }
    .statblock-divider2 {
      height:2px;
      background:linear-gradient(90deg,#9c2f2f,transparent);
      margin:.55rem 0;
    }
    .statblock-abilities {
      display:grid;
      grid-template-columns:repeat(6,1fr);
      text-align:center;
      margin:.5rem 0;
      border-top:1px solid rgba(156,47,47,.25);
      border-bottom:1px solid rgba(156,47,47,.25);
      padding:.4rem 0;
      gap:.2rem;
    }
    .ability-col {}
    .ability-name {
      font-size:.65rem;
      font-weight:bold;
      color:#58180d;
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .ability-val {
      font-size:.88rem;
      font-weight:bold;
      color:#1a1a1a;
    }
    .ability-mod {
      font-size:.72rem;
      color:#58180d;
    }
    .statblock-section-title {
      font-size:.8rem;
      font-variant:small-caps;
      letter-spacing:.08em;
      color:#58180d;
      border-bottom:1px solid rgba(156,47,47,.35);
      margin:.65rem 0 .35rem;
      padding-bottom:.2rem;
      font-weight:bold;
    }
    .statblock-trait { margin:.45rem 0; font-size:.81rem; line-height:1.5; }
    .statblock-trait-name { font-weight:bold; font-style:italic; color:#1a1a1a; }
    .statblock-cr {
      display:inline-block;
      background:rgba(156,47,47,.12);
      border:1px solid rgba(156,47,47,.3);
      border-radius:4px;
      padding:.1rem .5rem;
      font-size:.78rem;
      color:#58180d;
      font-weight:bold;
    }

    /* ── LISTS PAGE ── */
    .lists-grid { display:grid; grid-template-columns:240px 1fr; gap:1.25rem; max-width:880px; }
    .list-btn { width:100%; text-align:left; padding:.6rem .7rem; background:transparent; border:1px solid transparent; border-radius:7px; color:var(--text); cursor:pointer; font-family:inherit; font-size:.88rem; display:flex; align-items:center; justify-content:space-between; transition:all .14s; }
    .list-btn:hover { background:rgba(255,255,255,.05); }
    .list-btn.sel   { background:rgba(201,162,39,.1); border-color:var(--gold); color:var(--gold); }
    .list-btn-name  { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .list-cnt       { font-size:.72rem; color:var(--muted); background:var(--surf2); padding:.12rem .4rem; border-radius:99px; flex-shrink:0; }
    .enc-row { display:flex; align-items:flex-start; gap:.45rem; margin-bottom:.55rem; }
    .enc-num { width:22px; height:22px; flex-shrink:0; background:var(--surf2); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:.72rem; color:var(--muted); margin-top:7px; }
    .enc-field-wrap { flex:1; }
    .prob-row { display:flex; align-items:center; gap:.35rem; margin-top:3px; }
    .prob-bar { flex:1; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
    .prob-fill { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-l)); transition:width .3s; }
    .prob-pct  { font-size:.67rem; color:var(--muted); min-width:34px; text-align:right; }
    .enc-actions { display:flex; flex-direction:column; gap:2px; flex-shrink:0; margin-top:5px; }

    /* ── SETTINGS PAGE ── */
    .die-opts { display:flex; gap:.45rem; flex-wrap:wrap; }
    .die-opt { padding:.45rem .7rem; background:var(--surf2); border:2px solid var(--border); border-radius:6px; cursor:pointer; font-family:inherit; color:var(--muted); font-size:.85rem; transition:all .14s; }
    .die-opt.sel { border-color:var(--gold); color:var(--gold); background:rgba(201,162,39,.1); }
    .thresh-grid { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.5rem; }
    .thresh-btn { width:38px; height:38px; background:var(--surf2); border:2px solid var(--border); border-radius:6px; cursor:pointer; font-family:inherit; color:var(--muted); font-size:.88rem; display:flex; align-items:center; justify-content:center; transition:all .14s; }
    .thresh-btn.sel { border-color:var(--red); color:var(--red); background:rgba(230,57,70,.1); }
    .info-box { padding:.65rem .85rem; background:var(--surf2); border-radius:7px; font-size:.83rem; color:var(--muted); margin-top:.65rem; line-height:1.55; }
    .info-box strong { color:var(--gold); }

    .empty { text-align:center; padding:2.5rem 1rem; color:var(--muted); }
    .empty .ei { font-size:2.5rem; margin-bottom:.75rem; }

    /* ── ANIMATIONS ── */

    /* ── INITIATIVE TRACKER ── */
    .tracker-wrap { overflow:hidden; }
    .tracker-setup { padding:1rem; }
    .tracker-count { display:flex; align-items:center; gap:.65rem; }
    .tracker-count-val { min-width:28px; text-align:center; font-weight:bold; font-size:1.05rem; }
    .tracker-table { width:100%; border-collapse:collapse; font-size:.82rem; }
    .tracker-table th { padding:.35rem .4rem; background:var(--surf2); color:var(--muted); font-size:.67rem; text-transform:uppercase; letter-spacing:.06em; font-weight:normal; border-bottom:1px solid var(--border); }
    .tracker-table td { padding:.28rem .38rem; border-bottom:1px solid var(--border); vertical-align:middle; }
    .tracker-row-pc   { background:rgba(201,162,39,.07); }
    .tracker-row-dead { opacity:.42; }
    .tracker-foot { padding:.5rem 1rem; background:var(--surf2); font-size:.73rem; color:var(--muted); }
    .hp-ctrl { display:flex; align-items:center; gap:2px; justify-content:center; }
    .hp-val  { min-width:38px; text-align:center; font-variant-numeric:tabular-nums; font-size:.8rem; }

    @keyframes shake {
      0%   { transform:translate(0,0)      rotate(0deg);  }
      25%  { transform:translate(2px,-2px) rotate(4deg);  }
      50%  { transform:translate(-2px,1px) rotate(-3deg); }
      75%  { transform:translate(1px,2px)  rotate(2deg);  }
      100% { transform:translate(-1px,-1px) rotate(-1deg);}
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes popIn {
      0%   { opacity:0; transform:scale(.55); }
      70%  { transform:scale(1.08); }
      100% { opacity:1; transform:scale(1); }
    }
    .fade-up { animation:fadeUp .4s ease both; }
    .pop-in  { animation:popIn  .4s ease both; }

    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

    @media (max-width:1100px) {
      .roll-layout { grid-template-columns:1fr; }
      .sb-panel { position:static; }
    }
    @media (max-width:700px) {
      :root { --sw:0px; }
      .sidebar { display:none; }
      .main { margin-left:0; padding:1rem; }
      .lists-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ══════════════════════════════════════════
   UTILITY
══════════════════════════════════════════ */
function rollDie(s) { return Math.floor(Math.random()*s)+1; }
function genId()    { return '_'+Math.random().toString(36).substr(2,9); }

function listProbs(n) {
  if (n===0) return [];
  const freq=new Array(17).fill(0);
  for(let a=1;a<=8;a++) for(let b=1;b<=8;b++) freq[a+b]++;
  const c=new Array(n).fill(0);
  for(let s=2;s<=16;s++) c[Math.min(s-2,n-1)]+=freq[s];
  return c.map(x=>x/64);
}
function encProb(sides,thresh) { return ((thresh.length/sides)*100).toFixed(0); }

function abilityMod(score) { return Math.floor((score-10)/2); }
function modStr(score) { const m=abilityMod(score); return m>=0?`+${m}`:`${m}`; }

/* ══════════════════════════════════════════
   STORAGE
══════════════════════════════════════════ */
const DEF_SETTINGS = { checkDieSides:8, encounterValues:[7,8] };
const DEF_LISTS = [
  { id:'lst_forest', name:'🌲 Foresta', items:['Goblin','Wolf','Bandit','Commoner','Orc','Swarm of Insects','Scout','Troll','Dryad','Gnoll','Druid','Harpy','Ogre','Bandit Captain'] },
  { id:'lst_dungeon', name:'⚔️ Dungeon', items:['Skeleton','Zombie','Trap (magic)','Goblin','Gelatinous Cube','Kobold','Cultist','Mimic','Specter','Ogre','Vampire Spawn','Wight','Stone Golem','Young Dragon'] }
];

function loadData() {
  try {
    return {
      lists:        JSON.parse(localStorage.getItem('dnd_lists'))    || DEF_LISTS,
      settings:     JSON.parse(localStorage.getItem('dnd_settings')) || DEF_SETTINGS,
      activeListId: localStorage.getItem('dnd_active_list')         || DEF_LISTS[0].id,
    };
  } catch { return { lists:DEF_LISTS, settings:DEF_SETTINGS, activeListId:DEF_LISTS[0].id }; }
}
function save(k,v) { try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch {} }

/* ══════════════════════════════════════════
   DICE ANIMATION HOOK
══════════════════════════════════════════ */
function useDice(finalVal, trigger, sides) {
  const [disp,    setDisp]    = useState(null);
  const [spinning,setSpinning]= useState(false);
  const ref = useRef(null);
  useEffect(()=>{
    if (!trigger) return;
    setSpinning(true);
    let count=0; const MAX=20;
    ref.current = setInterval(()=>{
      setDisp(Math.floor(Math.random()*sides)+1);
      count++;
      if (count>=MAX) { clearInterval(ref.current); setDisp(finalVal); setSpinning(false); }
    },55);
    return ()=>clearInterval(ref.current);
  },[trigger]); // eslint-disable-line
  return { disp, spinning };
}

/* ══════════════════════════════════════════
   OPEN5E HOOK
══════════════════════════════════════════ */
/* ══════════════════════════════════════════
   CREATURE NORMALIZER (handles v1 + v2 Open5e)
══════════════════════════════════════════ */
function normalizeCreature(raw, apiVer) {
  // cap(): handles both plain strings and v2 objects like {key:"medium",name:"Medium"}
  const cap = s => {
    const str = (s && typeof s === 'object') ? (s.name || s.key || '') : (s || '');
    return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
  };
  // toStr(): handles arrays (v2 often returns arrays of objects with .name)
  const toStr = v => {
    if (!v) return '';
    if (typeof v === 'string') return v;
    if (Array.isArray(v)) return v.map(x => (x && typeof x === 'object') ? (x.name||x.key||String(x)) : String(x)).join(', ');
    return String(v);
  };

  // Ability scores: v1 = flat root, v2 nests under ability_scores
  const ab  = raw.ability_scores || {};
  const str = raw.strength      ?? ab.strength      ?? 10;
  const dex = raw.dexterity     ?? ab.dexterity     ?? 10;
  const con = raw.constitution  ?? ab.constitution  ?? 10;
  const int_= raw.intelligence  ?? ab.intelligence  ?? 10;
  const wis = raw.wisdom        ?? ab.wisdom        ?? 10;
  const cha = raw.charisma      ?? ab.charisma      ?? 10;

  // Saving throws: v1 = flat (strength_save…), v2 nests under saving_throws
  const sv  = raw.saving_throws || {};
  const getSave = (flat, key) => raw[flat] ?? sv[key] ?? null;

  // Skills: v1 = {stealth:6}, v2 skill_bonuses may be array [{skill:{key,name}, bonus:N}]
  let skills = {};
  if (raw.skills && !Array.isArray(raw.skills)) {
    skills = raw.skills;
  } else if (Array.isArray(raw.skill_bonuses)) {
    raw.skill_bonuses.forEach(s => {
      const k = s.skill?.key || s.skill?.name?.toLowerCase().replace(/ /g,'_') || '';
      if (k) skills[k] = s.bonus;
    });
  } else if (raw.skill_bonuses && typeof raw.skill_bonuses === 'object') {
    skills = raw.skill_bonuses;
  }

  // Senses: v2 may be an object instead of string
  function sensesToStr(s) {
    if (!s) return '';
    if (typeof s === 'string') return s;
    const p = [];
    if (s.darkvision)       p.push(`darkvision ${s.darkvision} ft.`);
    if (s.blindsight)       p.push(`blindsight ${s.blindsight} ft.`);
    if (s.tremorsense)      p.push(`tremorsense ${s.tremorsense} ft.`);
    if (s.truesight)        p.push(`truesight ${s.truesight} ft.`);
    if (s.passive_perception != null) p.push(`passive Perception ${s.passive_perception}`);
    return p.join(', ');
  }

  // Type: v2 may be object {key, name}
  const typeStr = (typeof raw.creature_type === 'object' && raw.creature_type)
    ? raw.creature_type.name
    : (raw.creature_type || raw.type || '');

  return {
    name: raw.name,
    slug: raw.key || raw.slug || '',
    size: cap(raw.size),
    type: cap(typeStr),
    subtype: toStr(raw.subtype) || '',
    alignment: toStr(raw.alignment) || '',
    armor_class: (() => {
      // v1: armor_class is a plain number
      // v2: may be a number, OR armor_classes:[{type,value}], OR {value:N}
      const ac  = raw.armor_class;
      const acs = raw.armor_classes; // v2 plural array
      if (typeof ac === 'number') return ac;
      if (Array.isArray(acs) && acs.length) {
        const nat = acs.find(x=>x.type==='natural'||x.type==='natural armor');
        return (nat ?? acs[0])?.value ?? null;
      }
      if (Array.isArray(ac) && ac.length) return ac[0].value ?? ac[0];
      if (ac && typeof ac === 'object') return ac.value ?? null;
      if (typeof ac === 'string' && !isNaN(parseInt(ac))) return parseInt(ac);
      console.log('[normalizeCreature] armor_class non riconosciuto:', ac, '| armor_classes:', acs);
      return null;
    })(),
    armor_desc: raw.armor_class_special || raw.armor_desc || (
      Array.isArray(raw.armor_classes) ? raw.armor_classes.map(x=>x.type).filter(Boolean).join(', ') : ''
    ) || '',
    hit_points: raw.hit_points,
    hit_dice: raw.hit_dice || '',
    speed: raw.speed || {},
    strength: str, dexterity: dex, constitution: con,
    intelligence: int_, wisdom: wis, charisma: cha,
    strength_save:     getSave('strength_save',     'strength'),
    dexterity_save:    getSave('dexterity_save',    'dexterity'),
    constitution_save: getSave('constitution_save', 'constitution'),
    intelligence_save: getSave('intelligence_save', 'intelligence'),
    wisdom_save:       getSave('wisdom_save',       'wisdom'),
    charisma_save:     getSave('charisma_save',     'charisma'),
    skills,
    damage_vulnerabilities: toStr(raw.damage_vulnerabilities),
    damage_resistances:     toStr(raw.damage_resistances),
    damage_immunities:      toStr(raw.damage_immunities),
    condition_immunities:   toStr(raw.condition_immunities),
    senses:    sensesToStr(raw.senses),
    languages: toStr(raw.languages) || '',
    challenge_rating: String(raw.challenge_rating ?? ''),
    xp: raw.experience_points || raw.cr,
    special_abilities:  raw.special_abilities  || [],
    actions:            raw.actions            || [],
    bonus_actions:      raw.bonus_actions      || [],
    reactions:          raw.reactions          || [],
    legendary_actions:  raw.legendary_actions  || [],
    legendary_desc: raw.legendary_description || raw.legendary_desc || '',
    document__title: raw.document?.title || raw.document__title || 'Open5e',
    _apiVer: apiVer,           // 'v2' | 'v1'
    _srdYear: apiVer==='v2' ? '2024' : '2014',
  };
}

/* ══════════════════════════════════════════
   OPEN5E HOOK  (v2 srd-2024 → v1 fallback)
══════════════════════════════════════════ */
function useMonster() {
  const [monster,     setMonster]     = useState(null);
  const [loading,     setLoading]     = useState(false);
  const [error,       setError]       = useState(null);
  const [suggestions, setSuggestions] = useState([]);
  const [srdYear,     setSrdYear]     = useState(null); // '2024' | '2014'
  const abortRef = useRef(null);

  const search = useCallback(async (query) => {
    const q = query.trim(); if (!q) return;
    if (abortRef.current) abortRef.current.abort();
    abortRef.current = new AbortController();
    const sig = abortRef.current.signal;
    setLoading(true); setError(null); setMonster(null); setSuggestions([]); setSrdYear(null);
    try {
      // 1️⃣  v2 API — D&D 2024 SRD (isolato: se fallisce, proviamo v1)
      try {
        const r2 = await fetch(
          `https://api.open5e.com/v2/creatures/?document__key__in=srd-2024&name__icontains=${encodeURIComponent(q)}&limit=6`,
          {signal: sig}
        );
        if (r2.ok) {
          const v2 = await r2.json();
          if (v2.results?.length) {
            setMonster(normalizeCreature(v2.results[0], 'v2')); setSrdYear('2024');
            setSuggestions(v2.results.slice(1).map(r=>normalizeCreature(r,'v2')));
            return;
          }
        } else {
          console.warn('[Open5e v2] HTTP', r2.status, r2.statusText);
        }
      } catch(e2) {
        if (e2.name === 'AbortError') throw e2;
        console.warn('[Open5e v2] fetch error:', e2.message);
      }

      // 2️⃣  v1 API — D&D 2014 SRD (fallback)
      const r1 = await fetch(
        `https://api.open5e.com/v1/monsters/?search=${encodeURIComponent(q)}&limit=6`,
        {signal: sig}
      );
      if (!r1.ok) throw new Error(`HTTP ${r1.status} ${r1.statusText}`);
      const v1 = await r1.json();

      if (v1.results?.length) {
        setMonster(normalizeCreature(v1.results[0], 'v1')); setSrdYear('2014');
        setSuggestions(v1.results.slice(1).map(r=>normalizeCreature(r,'v1')));
        return;
      }

      setError(`Nessun risultato per "${q}". Prova il nome in inglese (es: "Goblin", "Bandit").`);
    } catch(e) {
      if (e.name !== 'AbortError') {
        console.error('[Open5e] errore finale:', e.message, e);
        const detail = e.message || 'sconosciuto';
        setError(`Errore API: ${detail}. Apri F12 → Console per dettagli.`);
      }
    } finally { setLoading(false); }
  }, []);

  // Select an already-normalized suggestion (no extra fetch needed)
  function selectSuggestion(norm) {
    setMonster(norm);
    setSrdYear(norm._srdYear);
    setSuggestions([]);
  }

  return { monster, loading, error, suggestions, srdYear, search, selectSuggestion };
}


class ErrBound extends React.Component {
  constructor(p) { super(p); this.state = {err:null}; }
  static getDerivedStateFromError(e) { return {err:e.message}; }
  componentDidCatch(e,i) { console.error('StatBlock crash:', e, i); }
  render() {
    if (this.state.err) return (
      <div className="sb-error" style={{padding:'1rem'}}>
        ⚠️ Errore nel rendering dello stat block.<br/>
        <small style={{opacity:.7}}>{this.state.err}</small><br/>
        <small style={{opacity:.5}}>Vedi F12 → Console per dettagli.</small>
      </div>
    );
    return this.props.children;
  }
}

function StatBlock({ m }) {
  if (!m) return null;

  const abilities = [
    {name:'FOR', key:'strength'}, {name:'DES', key:'dexterity'},
    {name:'COS', key:'constitution'}, {name:'INT', key:'intelligence'},
    {name:'SAG', key:'wisdom'}, {name:'CAR', key:'charisma'},
  ];

  function crLabel(cr) {
    if (!cr && cr!==0) return '—';
    const xpMap = {'0':10,'1/8':25,'1/4':50,'1/2':100,'1':200,'2':450,'3':700,'4':1100,'5':1800,'6':2300,'7':2900,'8':3900,'9':5000,'10':5900,'11':7200,'12':8400,'13':10000,'14':11500,'15':13000,'16':15000,'17':18000,'18':20000,'19':22000,'20':25000,'21':33000,'22':41000,'23':50000,'24':62000,'25':75000,'26':90000,'27':105000,'28':120000,'29':135000,'30':155000};
    const xp = xpMap[String(cr)];
    return `${cr}${xp ? ` (${xp.toLocaleString()} PE)` : ''}`;
  }

  function speedStr(speed) {
    if (!speed) return '—';
    if (typeof speed === 'string') return speed;
    return Object.entries(speed).filter(([k,v])=>v && v!==true && k!=='hover').map(([k,v])=>{
      const dist = (typeof v === 'object') ? (v.distance||v) : v;
      if (k==='walk') return `${dist} ft.`;
      return `${k} ${dist} ft.`;
    }).concat(speed.hover ? ['(può librarsi)'] : []).join(', ') || '—';
  }

  const saves   = ['strength','dexterity','constitution','intelligence','wisdom','charisma']
    .filter(s => m[`${s}_save`] != null)
    .map(s => `${s.charAt(0).toUpperCase()+s.slice(1,3)} ${m[`${s}_save`]>=0?'+':''}${m[`${s}_save`]}`);

  const skillsArr = m.skills ? Object.entries(m.skills)
    .filter(([,v]) => typeof v === 'number')
    .map(([k,v]) => `${k.replace(/_/g,' ').replace(/\w/g,c=>c.toUpperCase())} ${v>=0?'+':''}${v}`) : [];

  const rows = [
    m.armor_class  && { label:'Classe Armatura', val:`${m.armor_class}${m.armor_desc?` (${m.armor_desc})`:''}`},
    m.hit_points   && { label:'Punti Ferita',    val:`${m.hit_points} (${m.hit_dice})`},
    m.speed        && { label:'Velocità',         val:speedStr(m.speed)},
  ].filter(Boolean);

  const rows2 = [
    saves.length && { label:'Tiri Salvezza', val:saves.join(', ')},
    skillsArr.length && { label:'Abilità',   val:skillsArr.join(', ')},
    m.damage_vulnerabilities  && { label:'Vulnerabilità', val:m.damage_vulnerabilities},
    m.damage_resistances      && { label:'Resistenze',    val:m.damage_resistances},
    m.damage_immunities       && { label:'Immunità danni',val:m.damage_immunities},
    m.condition_immunities    && { label:'Immunità condizioni', val:m.condition_immunities},
    m.senses   && { label:'Sensi',     val:m.senses},
    m.languages && { label:'Linguaggi', val:m.languages||'—'},
    true         && { label:'Grado Sfida', val: <span className="statblock-cr">{crLabel(m.challenge_rating)}</span> },
  ].filter(Boolean);

  return (
    <div className="statblock">
      <div className="statblock-name">{m.name}</div>
      <div className="statblock-type">
        {[m.size, m.type, m.subtype && `(${m.subtype})`, m.alignment].filter(Boolean).join(' ')}
      </div>
      <div className="statblock-divider" />

      <div className="statblock-body">
        {rows.map((r,i)=>(
          <div key={i} className="statblock-row">
            <strong>{r.label}</strong> {r.val}
          </div>
        ))}
      </div>
      <div className="statblock-divider" />

      <div className="statblock-body" style={{paddingTop:'.5rem'}}>
        {/* Ability scores */}
        <div className="statblock-abilities">
          {abilities.map(a=>(
            <div key={a.key} className="ability-col">
              <div className="ability-name">{a.name}</div>
              <div className="ability-val">{m[a.key] ?? '—'}</div>
              <div className="ability-mod">({modStr(m[a.key] ?? 10)})</div>
            </div>
          ))}
        </div>
      </div>
      <div className="statblock-divider" />

      <div className="statblock-body">
        {rows2.map((r,i)=>(
          <div key={i} className="statblock-row">
            <strong>{r.label}</strong> {r.val}
          </div>
        ))}
      </div>

      {m.special_abilities && m.special_abilities.length > 0 && (
        <div className="statblock-body" style={{paddingTop:0}}>
          <div className="statblock-divider2" />
          {m.special_abilities.map((t,i)=>(
            <div key={i} className="statblock-trait">
              <span className="statblock-trait-name">{t.name}. </span>{t.desc}
            </div>
          ))}
        </div>
      )}

      {m.actions && m.actions.length > 0 && (
        <div className="statblock-body" style={{paddingTop:0}}>
          <div className="statblock-divider" style={{height:3,margin:'.6rem -1.1rem .4rem'}} />
          <div className="statblock-section-title">Azioni</div>
          {m.actions.map((a,i)=>(
            <div key={i} className="statblock-trait">
              <span className="statblock-trait-name">{a.name}. </span>{a.desc}
            </div>
          ))}
        </div>
      )}

      {m.bonus_actions && m.bonus_actions.length > 0 && (
        <div className="statblock-body" style={{paddingTop:0}}>
          <div className="statblock-divider" style={{height:3,margin:'.6rem -1.1rem .4rem'}} />
          <div className="statblock-section-title">Azioni Bonus</div>
          {m.bonus_actions.map((a,i)=>(
            <div key={i} className="statblock-trait">
              <span className="statblock-trait-name">{a.name}. </span>{a.desc}
            </div>
          ))}
        </div>
      )}

      {m.reactions && m.reactions.length > 0 && (
        <div className="statblock-body" style={{paddingTop:0}}>
          <div className="statblock-divider" style={{height:3,margin:'.6rem -1.1rem .4rem'}} />
          <div className="statblock-section-title">Reazioni</div>
          {m.reactions.map((r,i)=>(
            <div key={i} className="statblock-trait">
              <span className="statblock-trait-name">{r.name}. </span>{r.desc}
            </div>
          ))}
        </div>
      )}

      {m.legendary_actions && m.legendary_actions.length > 0 && (
        <div className="statblock-body" style={{paddingTop:0}}>
          <div className="statblock-divider" style={{height:3,margin:'.6rem -1.1rem .4rem'}} />
          <div className="statblock-section-title">Azioni Leggendarie</div>
          {m.legendary_desc && <p style={{fontSize:'.79rem',marginBottom:'.4rem',color:'#444'}}>{m.legendary_desc}</p>}
          {m.legendary_actions.map((a,i)=>(
            <div key={i} className="statblock-trait">
              <span className="statblock-trait-name">{a.name}. </span>{a.desc}
            </div>
          ))}
        </div>
      )}

      <div style={{padding:'.4rem 1.1rem .6rem',background:'rgba(156,47,47,.05)',borderTop:'1px solid rgba(156,47,47,.15)'}}>
        <a href={`https://open5e.com/monsters/${m.slug}`} target="_blank" rel="noopener noreferrer"
          style={{fontSize:'.68rem',color:'#8a3210',textDecoration:'none',opacity:.7}}>
          📖 Open5e — {m.document__title || 'SRD'}
        </a>
      </div>
    </div>
  );
}

function StatBlockPanel({ autoSearchName, autoSearchTrigger, onMonsterLoad }) {
  const [query, setQuery]   = useState('');
  const { monster, loading, error, suggestions, srdYear, search, selectSuggestion } = useMonster();

  // Forward loaded monster to parent (for initiative tracker)
  useEffect(()=>{ if(monster && onMonsterLoad) onMonsterLoad(monster); }, [monster]);

  // Auto-search when a new encounter is rolled
  useEffect(()=>{
    if (!autoSearchName || !autoSearchTrigger) return;
    setQuery(autoSearchName);
    search(autoSearchName);
  }, [autoSearchTrigger]); // eslint-disable-line

  function handleSearch(e) {
    e.preventDefault();
    search(query);
  }

  return (
    <div className="sb-panel">
      <div className="sb-panel-header">
        <h3>📖 Stat Block</h3>
        {srdYear && (
          <span style={{fontSize:'.68rem',padding:'.12rem .45rem',borderRadius:'99px',fontWeight:'bold',
            background: srdYear==='2024'?'rgba(45,198,83,.18)':'rgba(201,162,39,.15)',
            color: srdYear==='2024'?'var(--green)':'var(--gold)'}}>
            SRD {srdYear}
          </span>
        )}
      </div>

      <form className="sb-search" onSubmit={handleSearch}>
        <input
          className="input-field"
          placeholder="Cerca mostro (in inglese)…"
          value={query}
          onChange={e => setQuery(e.target.value)}
          style={{flex:1}}
        />
        <button className="btn btn-primary" type="submit" style={{whiteSpace:'nowrap',flexShrink:0}}>
          🔍
        </button>
      </form>

      {suggestions.length > 0 && (
        <div className="sb-suggestions">
          <p>Altri risultati:</p>
          {suggestions.map(s => (
            <button key={s.slug||s.name} className="sb-sugg-btn"
              onClick={() => { setQuery(s.name); selectSuggestion(s); }}>
              {s.name}
            </button>
          ))}
        </div>
      )}

      <div className="sb-body">
        {loading && <div className="sb-loading">⏳ Ricerca in corso…</div>}
        {error   && <div className="sb-error">{error}</div>}
        {!loading && !error && !monster && (
          <div className="sb-placeholder">
            <div className="pi">🐉</div>
            <p>Lancia i dadi per vedere<br/>automaticamente lo stat block<br/>del mostro incontrato.</p>
            <p style={{marginTop:'.5rem',fontSize:'.78rem'}}>Oppure cerca manualmente<br/>il nome in inglese qui sopra.</p>
          </div>
        )}
        {!loading && monster && <ErrBound key={monster.slug||monster.name}><StatBlock m={monster} /></ErrBound>}
      </div>
    </div>
  );
}

function RollPage({ lists, settings, activeListId, setActiveListId, party }) {
  const [phase, setPhase]   = useState('idle');
  const [roll,  setRoll]    = useState(null);
  const [history,setHistory]= useState([]);
  const [chkTrig,setChkTrig]= useState(0);
  const [encTrig,setEncTrig]= useState(0);
  const [sbTrig, setSbTrig]       = useState(0);
  const [loadedMonster, setLoadedMonster] = useState(null);   // triggers stat block auto-search

  const list  = lists.find(l=>l.id===activeListId) || lists[0];
  const probs = list ? listProbs(list.items.length) : [];

  const chk = useDice(roll?.chkVal, chkTrig, settings.checkDieSides);
  const d1  = useDice(roll?.d1,     encTrig, 8);
  const d2  = useDice(roll?.d2,     encTrig, 8);

  function doRoll() {
    if (!list || list.items.length===0) return;
    if (phase==='chk' || phase==='enc-roll') return;

    const chkVal = rollDie(settings.checkDieSides);
    const isEnc  = settings.encounterValues.includes(chkVal);

    let r = { chkVal, isEnc };
    if (isEnc) {
      const a=rollDie(8), b=rollDie(8), sum=a+b;
      const idx=Math.min(sum-2, list.items.length-1);
      r = { ...r, d1:a, d2:b, sum, idx, name:list.items[idx] };
    }

    setRoll(r); setPhase('chk'); setChkTrig(t=>t+1);

    setTimeout(()=>{
      if (isEnc) {
        setPhase('enc-roll'); setEncTrig(t=>t+1);
        setTimeout(()=>{
          setPhase('enc');
          setSbTrig(t=>t+1);   // trigger stat block search
          setHistory(h=>[{...r,ts:Date.now()},...h].slice(0,12));
        },1250);
      } else {
        setPhase('no-enc');
        setHistory(h=>[{...r,ts:Date.now()},...h].slice(0,12));
      }
    },1250);
  }

  const busy   = phase==='chk'||phase==='enc-roll';
  const noList = !list||list.items.length===0;
  const pct    = encProb(settings.checkDieSides, settings.encounterValues);

  return (
    <div>
      <div className="page-header">
        <h2>🎲 Lancia i Dadi</h2>
        <p>Lista: <span style={{color:'var(--gold)'}}>{list?.name||'—'}</span>
           &nbsp;·&nbsp;Prob. incontro: <span style={{color:'var(--gold)'}}>{pct}%</span></p>
      </div>

      <div className="roll-layout">
        {/* ── Left column: roll controls ── */}
        <div className="roll-col">

          {lists.length>1 && (
            <div style={{width:'100%'}}>
              <label style={{fontSize:'.75rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:'.4rem'}}>Lista attiva</label>
              <select className="input-field" value={activeListId}
                onChange={e=>{ setActiveListId(e.target.value); setPhase('idle'); setRoll(null); setLoadedMonster(null); }}>
                {lists.map(l=><option key={l.id} value={l.id}>{l.name} ({l.items.length})</option>)}
              </select>
            </div>
          )}

          <button className="btn-roll" onClick={doRoll} disabled={busy||noList}>
            {busy?'🎲 Lanciando…':'🎲 Lancia i Dadi'}
          </button>
          {noList && <p style={{color:'var(--muted)',fontSize:'.85rem'}}>Lista vuota — aggiungici degli incontri!</p>}

          {phase!=='idle' && roll && (
            <div className="fade-up" style={{textAlign:'center',width:'100%'}}>
              <div style={{fontSize:'.72rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:'.65rem'}}>
                Tiro di verifica — d{settings.checkDieSides}
              </div>
              <div className="dice-row">
                <div className={`die ${chk.spinning?'rolling':(roll.isEnc?'landed-enc':'landed-safe')}`}>
                  <span>{chk.disp??'?'}</span>
                  <span className="die-lbl">d{settings.checkDieSides}</span>
                </div>
              </div>
              {!chk.spinning && (
                <div style={{marginTop:'.5rem',fontSize:'.8rem',color:'var(--muted)'}}>
                  Incontro su: {[...settings.encounterValues].sort((a,b)=>a-b).join(', ')}
                </div>
              )}
            </div>
          )}

          {(phase==='enc-roll'||phase==='enc') && roll?.isEnc && (
            <div className="fade-up" style={{textAlign:'center',width:'100%'}}>
              <div style={{fontSize:'.72rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:'.65rem'}}>
                Tipo di incontro — 2d8
              </div>
              <div className="dice-row">
                <div className={`die ${d1.spinning?'rolling':'landed-neutral'}`}>
                  <span>{d1.disp??'?'}</span><span className="die-lbl">d8</span>
                </div>
                <span className="die-sep">+</span>
                <div className={`die ${d2.spinning?'rolling':'landed-neutral'}`}>
                  <span>{d2.disp??'?'}</span><span className="die-lbl">d8</span>
                </div>
                <span className="die-sep">=</span>
                <div className="die sum-die">
                  <span>{!d1.spinning&&!d2.spinning?roll.sum:'?'}</span>
                  <span className="die-lbl">somma</span>
                </div>
              </div>
            </div>
          )}

          {phase==='enc' && roll && (
            <div className="result-card enc pop-in" style={{width:'100%'}}>
              <div className="result-label">Risultato</div>
              <div className="result-big enc">⚔️ INCONTRO!</div>
              <div className="enc-name">{roll.name}</div>
              <div className="enc-sub">
                Posizione {roll.idx+1} su {list.items.length}&nbsp;·&nbsp;
                Prob: {probs[roll.idx]?(probs[roll.idx]*100).toFixed(1):'?'}%
              </div>
            </div>
          )}

          {phase==='no-enc' && roll && (
            <div className="result-card safe pop-in" style={{width:'100%'}}>
              <div className="result-label">Risultato</div>
              <div className="result-big safe">✅ Tutto Tranquillo</div>
              <div style={{color:'var(--muted)',fontSize:'.88rem',marginTop:'.4rem'}}>
                Nessun incontro casuale questo round.
              </div>
            </div>
          )}

          {history.length>0 && (
            <div className="history-list">
              <h3>Storico lanci</h3>
              {history.map((h,i)=>(
                <div key={i} className="hist-item">
                  <span className={`badge ${h.isEnc?'badge-enc':'badge-safe'}`}>{h.isEnc?'⚔️':'✅'}</span>
                  <span style={{flex:1}}>{h.isEnc?h.name:'Nessun incontro'}</span>
                  <span className="hist-dice">
                    {h.isEnc?`d${settings.checkDieSides}:${h.chkVal} | 2d8:${h.sum}`:`d${settings.checkDieSides}:${h.chkVal}`}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* ── Col 2: stat block ── */}
        <StatBlockPanel
          autoSearchName={roll?.name||null}
          autoSearchTrigger={sbTrig}
          onMonsterLoad={setLoadedMonster}
        />
        {/* ── Col 3: initiative tracker ── */}
        <InitiativeTracker
          encounterName={roll?.name||null}
          monster={loadedMonster}
          encTrigger={phase==='enc' ? sbTrig : 0}
          party={party||[]}
        />
      </div>
    </div>
  );
}
